name: Build and deploy picons

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile scripts/build.py scripts/admin.py scripts/add_channel.py scripts/sync_provider.py receiver/update_picons.py receiver/plugin/Plugins/Extensions/SatellitePicons/plugin.py
          python receiver/update_picons.py --help >/dev/null

      - name: Build picons
        run: python scripts/build.py

      - name: Validate provider catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          providers = json.loads(Path("public/providers.json").read_text())
          version = json.loads(Path("public/version.json").read_text())

          assert providers.get("schema") == 1
          assert isinstance(providers.get("providers"), list)
          assert version.get("providers") == "providers.json"

          for provider in providers["providers"]:
              if provider.get("available"):
                  package = provider.get("package")
                  assert package, provider
                  assert (Path("public") / package).is_file(), package
          PY

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
