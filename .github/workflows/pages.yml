name: Build and deploy picons

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile scripts/build.py scripts/build_v2.py scripts/admin.py scripts/admin_v2.py scripts/admin_curated.py scripts/catalog_common.py scripts/add_channel.py scripts/catalogue_changes.py scripts/logo_presets.py scripts/sync_vhannibal.py receiver/update_picons.py receiver/plugin/Plugins/Extensions/SatellitePicons/plugin.py
          python receiver/update_picons.py --help >/dev/null
          PYTHONPATH=scripts python -m unittest -v test_station_names test_skylink_lineups
          node --check web/app.js

      - name: Admin curated artwork smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import admin_curated

          rows, stats = admin_curated.load_curated_channels()
          assert all("logo_url" not in row for row in rows), "Imported provider artwork leaked into curated admin"

          client = admin_curated.hub.legacy.app.test_client()
          page = client.get("/")
          assert page.status_code == 200, page.status_code
          assert b"Picon Hub" in page.data
          assert b"Vhannibal" in page.data
          assert b'name="publish" checked' not in page.data

          matches = client.get("/api/station-matches?name=Markiza")
          assert matches.status_code == 200, matches.status_code
          payload = matches.get_json()
          assert payload["station_key"] == "markiza", payload
          assert isinstance(payload.get("matches"), list), payload
          print("Curated admin smoke test OK; local logos:", stats.get("local_logos", 0))
          PY

      - name: SVG cleanup preset regression tests
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          import sys
          sys.path.insert(0, "scripts")
          from logo_presets import apply_preset

          # AMC-style opaque black backdrop with light lettering.
          text = Image.new("RGBA", (400, 180), (0, 0, 0, 255))
          ImageDraw.Draw(text).rectangle((55, 40, 340, 142), fill=(255, 255, 255, 255))
          cleaned = apply_preset(text, "light-text")
          assert cleaned.getpixel((0, 0))[3] == 0
          assert cleaned.getpixel((90, 90))[3] == 255

          # Cartoon Network-style black/white artwork with padded lower area.
          tiled = Image.new("RGBA", (400, 260), (0, 0, 0, 255))
          ImageDraw.Draw(tiled).rectangle((200, 0, 399, 139), fill=(255, 255, 255, 255))
          cropped = apply_preset(tiled, "segmented")
          assert cropped.width == 400 and cropped.height < 200
          assert cropped.getpixel((0, 0))[3] == 255
          assert cropped.getpixel((300, 20))[:3] == (255, 255, 255)
          assert apply_preset(tiled, "original").size == tiled.size
          print("Presets keep design tiles, remove opaque empty padding and transparent dark canvas.")
          PY

      - name: Professional renderer regression test
        run: |
          python - <<'PY'
          import io
          import sys
          import tempfile
          from pathlib import Path

          from PIL import Image, ImageDraw

          sys.path.insert(0, "scripts")
          import build
          import admin

          with tempfile.TemporaryDirectory() as td:
              source = Path(td) / "logo.png"

              # Synthetic logo with transparent antialiased edges and strong colour.
              im = Image.new("RGBA", (800, 300), (0, 0, 0, 0))
              draw = ImageDraw.Draw(im)
              draw.rounded_rectangle((30, 30, 770, 270), radius=55, fill=(220, 30, 40, 255))
              im.save(source)

              template = Image.open(build.TEMPLATE).convert("RGBA")
              rendered = build.render_logo(source, template, False, 1.0, False)

              assert rendered.size == (150, 90), rendered.size
              assert rendered.mode == "RGBA", rendered.mode

              # No generated artwork may extend beyond the fixed picon canvas.
              bbox = rendered.getbbox()
              assert bbox is not None
              assert 0 <= bbox[0] < bbox[2] <= 150
              assert 0 <= bbox[1] < bbox[3] <= 90

              raw = source.read_bytes()
              preview = admin.render_preview_png(
                  raw=raw,
                  ext=".png",
                  dark_to_white=False,
                  optical_scale=1.0,
                  edge_cleanup=False,
              )
              preview_im = Image.open(io.BytesIO(preview)).convert("RGBA")
              assert preview_im.size == rendered.size
              assert preview_im.tobytes() == rendered.tobytes(), "Admin preview differs from final renderer"

          print("Professional renderer regression test OK")
          PY

      - name: Build Picon Hub
        run: python scripts/build_v2.py

      - name: Validate provider catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          providers = json.loads(Path("public/providers.json").read_text())
          version = json.loads(Path("public/version.json").read_text())

          assert providers.get("schema") == 1
          assert isinstance(providers.get("providers"), list)
          assert version.get("providers") == "providers.json"

          deliveries = {p.get("delivery") for p in providers["providers"]}
          assert "satellite" in deliveries, deliveries
          assert deliveries == {"satellite"}, deliveries

          assert {p.get("id") for p in providers["providers"]} == {"skylink-sk"}
          for provider in providers["providers"]:
              assert provider.get("delivery") == "satellite", provider
              expected = int(provider.get("channel_count") or 0)
              curated = int(provider.get("curated_channel_count") or 0)
              complete = bool(provider.get("complete"))
              package = provider.get("package")

              assert complete == (expected > 0 and curated == expected), provider
              assert bool(provider.get("available")) == complete, provider

              if complete:
                  assert package, provider
                  assert (Path("public") / package).is_file(), package
              else:
                  assert package is None, provider
          PY

      - name: Verify published logos and provider assignments
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, "scripts")
          from catalog_common import channel_identity

          index = json.loads(Path("public/index.json").read_text(encoding="utf-8"))
          stations = yaml.safe_load(Path("station-artwork.yml").read_text(encoding="utf-8"))["stations"]
          rendered = {}
          for channel in index["channels"]:
              key = channel_identity(channel, channel.get("provider_group"))
              rendered[key] = channel

          # The historical operator assignments remain in station-artwork.yml,
          # but only Vhannibal services are published in this edition.
          for station in ("cartoonito", "cinemax"):
              artwork = stations[station]
              vhannibal_targets = [target for target in artwork["targets"]
                                   if target.startswith("sat:skylink-sk:")]
              assert vhannibal_targets, f"{station}: missing Vhannibal target"
              for target in vhannibal_targets:
                  assert target in rendered, f"{station}: missing published service {target}"
                  channel = rendered[target]
                  assert channel.get("files"), f"{station}: no generated picons for {target}"
                  for filename in channel["files"]:
                      assert (Path("public/picons") / filename).is_file(), (
                          f"{station}: missing picon {filename}"
                      )

          orbit = json.loads(Path("public/orbits.json").read_text(encoding="utf-8"))
          assert orbit["source"] == "Vhannibal"
          assert orbit["orbits"]
          rendered_positions = {ch["satellite_position"] for ch in index["channels"]}
          assert rendered_positions <= {p["id"] for p in orbit["orbits"]}
          print("Vhannibal orbit packs and curated Cartoonito/Cinemax picons verified")
          PY

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
