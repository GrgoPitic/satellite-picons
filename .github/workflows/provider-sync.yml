name: Synchronize provider catalogues

on:
  push:
    branches:
      - main
      - feature/provider-picon-packs
    paths:
      - scripts/sync_provider.py
      - providers.yml
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize provider catalogues
        shell: bash
        run: |
          set -u

          sync_provider() {
            local provider="$1"
            local output="$2"
            local label="$3"
            local success=0

            echo "::group::Synchronize ${label} metadata"
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3"
              if python scripts/sync_provider.py "$provider" \
                --delay 0.08 \
                --output "$output"; then
                success=1
                break
              fi

              echo "::warning::${label}: synchronization attempt ${attempt}/3 failed."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              fi
            done

            if [ "$success" -ne 1 ]; then
              if git cat-file -e "HEAD:${output}" 2>/dev/null; then
                echo "::warning::${label}: upstream metadata source is temporarily unavailable. Keeping the last validated catalogue from the repository."
                git restore --source=HEAD -- "$output"
              else
                echo "::error::${label}: synchronization failed and no previous catalogue is available."
                echo "::endgroup::"
                return 1
              fi
            fi
            echo "::endgroup::"
          }

          sync_provider skylink provider-data/skylink.json "Skylink"
          sync_provider antik provider-data/antik.json "ANTIK Sat"

      - name: Validate generated provider metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules = {
              "skylink": {"min_channels": 250, "max_errors": 8},
              "antik": {"min_channels": 70, "max_errors": 8},
          }

          for provider_id, rule in rules.items():
              path = Path("provider-data") / f"{provider_id}.json"
              data = json.loads(path.read_text())
              stats = data["stats"]

              assert data["provider"] == provider_id
              assert data["source"].get("artwork_mode") == "manual", data["source"]
              assert data["source"].get("upstream_logos_imported") is False, data["source"]
              assert stats["channels_parsed"] >= rule["min_channels"], stats
              assert stats["errors"] <= rule["max_errors"], stats

              for channel in data.get("channels", []):
                  assert "logo_url" not in channel, (provider_id, channel.get("name"))
                  assert "logo_slug" not in channel, (provider_id, channel.get("name"))
                  assert "logo_source" not in channel, (provider_id, channel.get("name"))

              print(provider_id)
              print(json.dumps(stats, indent=2))
          PY

      - name: Validate complete build with curated artwork only
        run: |
          python scripts/build.py
          python - <<'PY'
          import json
          from pathlib import Path

          providers = json.loads(Path("public/providers.json").read_text())
          by_id = {p["id"]: p for p in providers["providers"]}

          for provider_id in ("skylink", "antik"):
              provider = by_id[provider_id]
              source_stats = provider.get("source_stats") or {}

              # In metadata-only mode the full catalogue size comes from the
              # synchronized provider metadata. channel_count currently means
              # channels that already have curated artwork and were rendered.
              assert source_stats.get("channels_parsed", 0) > 0, provider

              if provider["available"]:
                  assert provider["picon_count"] > 0, provider
                  package = Path("public") / provider["package"]
                  assert package.is_file(), package

              print(
                  provider_id,
                  "catalogue_channels=", source_stats.get("channels_parsed", 0),
                  "curated_channels=", provider["channel_count"],
                  "curated_picons=", provider["picon_count"],
                  "available=", provider["available"],
              )
          PY

      - name: Commit synchronized catalogues
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"

          git add provider-data/skylink.json provider-data/antik.json

          if git diff --cached --quiet; then
            echo "Provider data is already current."
            echo "PROVIDER_DATA_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "data: synchronize provider metadata"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "PROVIDER_DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Trigger package rebuild after data commit
        if: env.PROVIDER_DATA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload synchronized catalogues
        uses: actions/upload-artifact@v4
        with:
          name: provider-data
          path: |
            provider-data/skylink.json
            provider-data/antik.json
          if-no-files-found: error
          retention-days: 7
