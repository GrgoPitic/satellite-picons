name: Synchronize provider catalogues

on:
  push:
    branches:
      - main
      - feature/provider-picon-packs
    paths:
      - scripts/sync_provider.py
      - providers.yml
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize all provider metadata
        shell: bash
        run: |
          set -u

          mapfile -t PROVIDERS < <(python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          for provider in cfg.get("providers", []):
              source = provider.get("source") or {}
              if source.get("type") == "satelitnatv" and provider.get("id"):
                  print(provider["id"])
          PY
          )

          for provider in "${PROVIDERS[@]}"; do
            output="provider-data/${provider}.json"
            success=0

            echo "::group::Synchronize ${provider} metadata"
            for attempt in 1 2; do
              echo "Attempt ${attempt}/2"
              if python scripts/sync_provider.py "$provider" \
                --delay 0.05 \
                --output "$output"; then
                success=1
                break
              fi
              echo "::warning::${provider}: upstream metadata attempt ${attempt}/2 failed."
              [ "$attempt" -lt 2 ] && sleep 15
            done

            if [ "$success" -ne 1 ]; then
              if git cat-file -e "HEAD:${output}" 2>/dev/null; then
                echo "::warning::${provider}: upstream unavailable; using last catalogue."
                git restore --source=HEAD -- "$output"
              else
                echo "::warning::${provider}: no catalogue yet; provider stays visible with zero channels until a later successful sync."
                rm -f "$output"
              fi
            fi
            echo "::endgroup::"
          done

      - name: Normalize catalogues to metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("provider-data").glob("*.json")):
              data = json.loads(path.read_text())
              source = data.setdefault("source", {})
              source.pop("logo_repository", None)
              source.pop("logo_revision", None)
              source["artwork_mode"] = "manual"
              source["upstream_logos_imported"] = False

              stats = data.setdefault("stats", {})
              for key in ("logos_matched", "logos_missing", "logo_coverage_percent"):
                  stats.pop(key, None)
              stats["upstream_logos_imported"] = 0

              for channel in data.get("channels", []) or []:
                  channel.pop("logo_url", None)
                  channel.pop("logo_slug", None)
                  channel.pop("logo_source", None)

              data.pop("missing_logos", None)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
              print("normalized", path)
          PY

      - name: Validate generated provider metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          providers = [p for p in cfg.get("providers", []) if (p.get("source") or {}).get("type") == "satelitnatv"]
          assert providers, "No SatelitnaTV providers configured"

          available = 0
          for provider in providers:
              provider_id = provider["id"]
              path = Path("provider-data") / f"{provider_id}.json"
              if not path.is_file():
                  print(f"::warning::{provider_id}: catalogue not available yet")
                  continue

              available += 1
              data = json.loads(path.read_text())
              stats = data.get("stats") or {}
              assert data["provider"] == provider_id
              assert data["source"].get("artwork_mode") == "manual", data["source"]
              assert data["source"].get("upstream_logos_imported") is False, data["source"]
              assert stats.get("channels_parsed", 0) > 0, (provider_id, stats)
              for channel in data.get("channels", []):
                  assert "logo_url" not in channel
                  assert "logo_slug" not in channel
                  assert "logo_source" not in channel
              print(provider_id, json.dumps(stats, ensure_ascii=False))

          assert available > 0, "No provider catalogue is available; keep the workflow green only when at least one fallback/fresh catalogue exists"
          PY

      - name: Validate Picon Hub build
        run: |
          python scripts/build_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          providers = json.loads(Path("public/providers.json").read_text())
          assert providers.get("providers"), providers
          deliveries = {p.get("delivery") for p in providers["providers"]}
          assert "satellite" in deliveries, deliveries
          assert "iptv" in deliveries, deliveries

          for provider in providers["providers"]:
              if provider.get("available"):
                  assert provider.get("picon_count", 0) > 0, provider
                  package = Path("public") / provider["package"]
                  assert package.is_file(), package
          PY

      - name: Commit synchronized catalogues
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"
          git add -A provider-data

          if git diff --cached --quiet; then
            echo "Provider metadata is already current."
            echo "PROVIDER_DATA_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "data: synchronize provider metadata"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "PROVIDER_DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Trigger package rebuild after data commit
        if: env.PROVIDER_DATA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload synchronized catalogues
        uses: actions/upload-artifact@v4
        with:
          name: provider-data
          path: provider-data/*.json
          if-no-files-found: warn
          retention-days: 7
