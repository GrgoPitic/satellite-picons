name: Synchronize provider catalogues

on:
  push:
    branches:
      - main
      - feature/provider-picon-packs
    paths:
      - scripts/sync_provider.py
      - providers.yml
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize all provider metadata
        shell: bash
        run: |
          set -u

          mapfile -t PROVIDERS < <(python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          for provider in cfg.get("providers", []):
              source = provider.get("source") or {}
              if source.get("type") == "satelitnatv" and provider.get("id"):
                  print(provider["id"])
          PY
          )

          failures=0

          for provider in "${PROVIDERS[@]}"; do
            output="provider-data/${provider}.json"
            success=0

            echo "::group::Synchronize ${provider} metadata"
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3"
              if python scripts/sync_provider.py "$provider" \
                --delay 0.05 \
                --output "$output"; then
                success=1
                break
              fi

              echo "::warning::${provider}: synchronization attempt ${attempt}/3 failed."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done

            if [ "$success" -ne 1 ]; then
              if git cat-file -e "HEAD:${output}" 2>/dev/null; then
                echo "::warning::${provider}: upstream metadata is temporarily unavailable. Keeping the last validated local catalogue."
                git restore --source=HEAD -- "$output"
              else
                echo "::error::${provider}: no fresh metadata and no previous catalogue exists."
                failures=$((failures + 1))
              fi
            fi
            echo "::endgroup::"
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} provider(s) could not be synchronized and have no fallback catalogue."
            exit 1
          fi

      - name: Validate generated provider metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          providers = [
              p for p in cfg.get("providers", [])
              if (p.get("source") or {}).get("type") == "satelitnatv"
          ]

          assert providers, "No SatelitnaTV providers configured"

          for provider in providers:
              provider_id = provider["id"]
              path = Path("provider-data") / f"{provider_id}.json"
              assert path.is_file(), path

              data = json.loads(path.read_text())
              stats = data["stats"]

              assert data["provider"] == provider_id
              assert data["source"].get("artwork_mode") == "manual", data["source"]
              assert data["source"].get("upstream_logos_imported") is False, data["source"]
              assert stats["channels_parsed"] > 0, (provider_id, stats)
              assert stats["errors"] <= max(25, stats["detail_links"] // 5), (provider_id, stats)

              for channel in data.get("channels", []):
                  assert "logo_url" not in channel, (provider_id, channel.get("name"))
                  assert "logo_slug" not in channel, (provider_id, channel.get("name"))
                  assert "logo_source" not in channel, (provider_id, channel.get("name"))

              print(provider_id, json.dumps(stats, ensure_ascii=False))
          PY

      - name: Validate complete build with curated artwork only
        run: |
          python scripts/build.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          expected = {
              p["id"]
              for p in cfg.get("providers", [])
              if (p.get("source") or {}).get("type") == "satelitnatv"
          }

          payload = json.loads(Path("public/providers.json").read_text())
          by_id = {p["id"]: p for p in payload["providers"]}

          missing = sorted(expected - set(by_id))
          assert not missing, missing

          for provider_id in sorted(expected):
              provider = by_id[provider_id]
              assert provider["channel_count"] > 0, provider

              # Providers remain visible even before artwork is curated.
              # A downloadable package is required only once curated picons exist.
              if provider["available"]:
                  assert provider["picon_count"] > 0, provider
                  package = Path("public") / provider["package"]
                  assert package.is_file(), package

              print(
                  provider_id,
                  "channels=", provider["channel_count"],
                  "curated_picons=", provider["picon_count"],
                  "available=", provider["available"],
              )
          PY

      - name: Commit synchronized catalogues
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"

          git add -A provider-data

          if git diff --cached --quiet; then
            echo "Provider data is already current."
            echo "PROVIDER_DATA_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "data: synchronize provider metadata"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "PROVIDER_DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Trigger package rebuild after data commit
        if: env.PROVIDER_DATA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload synchronized catalogues
        uses: actions/upload-artifact@v4
        with:
          name: provider-data
          path: provider-data/*.json
          if-no-files-found: error
          retention-days: 7
