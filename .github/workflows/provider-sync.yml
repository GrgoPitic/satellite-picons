name: Synchronize provider catalogues

on:
  push:
    branches:
      - main
      - feature/provider-picon-packs
    paths:
      - scripts/sync_provider.py
      - providers.yml
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize all SatelitnaTV providers
        run: |
          python scripts/sync_provider.py all \
            --delay 0.05 \
            --min-coverage 0

      - name: Validate generated provider data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          providers = [
              p for p in cfg.get("providers", [])
              if (p.get("source") or {}).get("type") == "satelitnatv"
          ]

          assert providers, "No SatelitnaTV providers configured"

          for provider in providers:
              provider_id = provider["id"]
              path = Path("provider-data") / f"{provider_id}.json"
              assert path.is_file(), path

              data = json.loads(path.read_text())
              stats = data["stats"]

              assert data["provider"] == provider_id
              assert stats["channels_parsed"] > 0, (provider_id, stats)
              assert stats["errors"] <= max(25, stats["detail_links"] // 5), (provider_id, stats)

              print(provider_id, json.dumps(stats, ensure_ascii=False))
          PY

      - name: Validate complete build with synchronized data
        run: |
          python scripts/build.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path("providers.yml").read_text()) or {}
          expected = {
              p["id"]
              for p in cfg.get("providers", [])
              if (p.get("source") or {}).get("type") == "satelitnatv"
          }

          payload = json.loads(Path("public/providers.json").read_text())
          by_id = {p["id"]: p for p in payload["providers"]}

          missing = sorted(expected - set(by_id))
          assert not missing, missing

          available = 0
          for provider_id in sorted(expected):
              provider = by_id[provider_id]
              assert provider["channel_count"] > 0, provider
              if provider["available"]:
                  available += 1
                  package = Path("public") / provider["package"]
                  assert package.is_file(), package
              print(
                  provider_id,
                  provider["channel_count"],
                  provider["picon_count"],
                  provider["package"],
              )

          assert available == len(expected), (available, len(expected))
          PY

      - name: Commit synchronized catalogues
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"

          git add -A provider-data

          if git diff --cached --quiet; then
            echo "Provider data is already current."
            echo "PROVIDER_DATA_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "data: synchronize all provider catalogues"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "PROVIDER_DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Trigger package rebuild after data commit
        if: env.PROVIDER_DATA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload synchronized catalogues
        uses: actions/upload-artifact@v4
        with:
          name: provider-data
          path: provider-data/*.json
          if-no-files-found: error
          retention-days: 7
