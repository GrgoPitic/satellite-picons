name: Synchronize Vhannibal catalogues

on:
  push:
    branches:
      - main
      - feature/vhannibal-orbit-hub
    paths:
      - scripts/sync_vhannibal.py
      - scripts/catalogue_changes.py
      - scripts/assign_station_artwork.py
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vhannibal-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vhannibal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve prior catalogue for diff
        run: |
          mkdir -p "${RUNNER_TEMP}/provider-before"
          cp provider-data/skylink-sk.json "${RUNNER_TEMP}/provider-before/" 2>/dev/null || true
      - name: Synchronize Vhannibal safely
        shell: bash
        run: |
          if python scripts/sync_vhannibal.py; then
            echo "SYNC_OK=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Vhannibal download/validation failed; preserving last known good catalogue."
            echo "SYNC_OK=false" >> "$GITHUB_ENV"
          fi
      - name: Record changes and assign curated artwork
        if: env.SYNC_OK == 'true'
        run: |
          python scripts/catalogue_changes.py --before "${RUNNER_TEMP}/provider-before" --provider skylink-sk
          python scripts/assign_station_artwork.py
      - name: Validate source without touching user logos
        if: env.SYNC_OK == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("provider-data/skylink-sk.json").read_text(encoding="utf-8"))
          assert data.get("source",{}).get("type") == "vhannibal"
          assert len(data.get("channels", [])) >= 50
          for ch in data["channels"]:
              assert ch.get("service_reference") and ch.get("satellite_position"), ch
              assert "logo" not in ch
          print("Vhannibal metadata validated:", len(data["channels"]))
          PY
      - name: Commit changed metadata and history
        if: env.SYNC_OK == 'true'
        shell: bash
        run: |
          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"
          git add provider-data/skylink-sk.json station-artwork.yml catalogue-changes.json
          if git diff --cached --quiet; then
            echo "No changes in Vhannibal metadata."
            exit 0
          fi
          git commit -m "data: sync Vhannibal orbital catalogue"
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "${BRANCH}"
          if ! git rebase FETCH_HEAD; then
            git rebase --abort || true
            echo "::error::Synchronisation commit conflicts with newer changes; no push."
            exit 1
          fi
          git push origin "HEAD:${BRANCH}"
      - name: Rebuild current public catalogue
        if: env.SYNC_OK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
