name: Synchronize provider catalogues

on:
  push:
    branches:
      - main
      - feature/provider-picon-packs
    paths:
      - scripts/sync_provider.py
      - providers.yml
      - .github/workflows/provider-sync.yml
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: provider-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev librsvg2-bin

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize Skylink
        run: |
          python scripts/sync_provider.py skylink \
            --delay 0.08 \
            --min-coverage 70 \
            --output provider-data/skylink.json

      - name: Synchronize ANTIK Sat
        run: |
          python scripts/sync_provider.py antik \
            --delay 0.08 \
            --min-coverage 70 \
            --output provider-data/antik.json

      - name: Validate generated provider data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules = {
              "skylink": {
                  "min_channels": 250,
                  "min_logos": 240,
                  "max_errors": 8,
                  "min_coverage": 70,
              },
              "antik": {
                  "min_channels": 70,
                  "min_logos": 65,
                  "max_errors": 8,
                  "min_coverage": 70,
              },
          }

          for provider_id, rule in rules.items():
              path = Path("provider-data") / f"{provider_id}.json"
              data = json.loads(path.read_text())
              stats = data["stats"]

              assert data["provider"] == provider_id
              assert stats["channels_parsed"] >= rule["min_channels"], stats
              assert stats["logos_matched"] >= rule["min_logos"], stats
              assert stats["errors"] <= rule["max_errors"], stats
              assert stats["logo_coverage_percent"] >= rule["min_coverage"], stats

              print(provider_id)
              print(json.dumps(stats, indent=2))
          PY

      - name: Validate complete build with synchronized data
        run: |
          python scripts/build.py
          python - <<'PY'
          import json
          from pathlib import Path

          providers = json.loads(Path("public/providers.json").read_text())
          by_id = {p["id"]: p for p in providers["providers"]}

          for provider_id in ("skylink", "antik"):
              provider = by_id[provider_id]
              assert provider["available"], provider
              assert provider["channel_count"] > 0, provider
              assert provider["picon_count"] > 0, provider
              package = Path("public") / provider["package"]
              assert package.is_file(), package
              print(provider_id, provider["channel_count"], provider["picon_count"], package)
          PY

      - name: Commit synchronized catalogues
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "JohnyWick"
          git config user.email "42406628+GrgoPitic@users.noreply.github.com"

          git add provider-data/skylink.json provider-data/antik.json

          if git diff --cached --quiet; then
            echo "Provider data is already current."
            echo "PROVIDER_DATA_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "data: synchronize provider catalogues"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "PROVIDER_DATA_CHANGED=true" >> "$GITHUB_ENV"

      - name: Trigger package rebuild after data commit
        if: env.PROVIDER_DATA_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload synchronized catalogues
        uses: actions/upload-artifact@v4
        with:
          name: provider-data
          path: |
            provider-data/skylink.json
            provider-data/antik.json
          if-no-files-found: error
          retention-days: 7
