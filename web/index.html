<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Satellite Picons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">ENIGMA2 • SATELLITE PICONS</p>
        <h1>Satellite Picons</h1>
        <p class="lead">Bezplatné 150×90 satelitné picony podľa Enigma2 service reference.</p>
      </div>
      <a class="button" id="package" href="#">Stiahnuť celý balík</a>
    </header>

    <section class="stats">
      <div><strong id="channels">—</strong><span>kanálov</span></div>
      <div><strong id="picons">—</strong><span>piconov</span></div>
      <div><strong id="updated">—</strong><span>aktualizované</span></div>
    </section>

    <section class="catalog">
      <input id="search" type="search" placeholder="Hľadať kanál alebo service reference…" autocomplete="off">
      <div id="grid" class="grid"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
